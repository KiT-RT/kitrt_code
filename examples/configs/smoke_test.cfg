%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%  KiT-RT laptop smoke test             %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%
% Run from the repository root after building build_omp/KiT-RT:
% ./build_omp/KiT-RT examples/configs/smoke_test.cfg
%
OUTPUT_DIR = ../result/smoke_test
OUTPUT_FILE = smoke_test
LOG_DIR = ../result/smoke_test/logs
MESH_FILE = ../meshes/checkerboard_debug.su2
%
PROBLEM = CHECKERBOARD
TIME_FINAL = 0.1
SPATIAL_DIM = 3
SOURCE_MAGNITUDE = 1.0
%
SOLVER = SN_SOLVER
CFL_NUMBER = 0.45
RECONS_ORDER = 1
%
BC_DIRICHLET = ( void )
%
QUAD_TYPE = GAUSS_LEGENDRE_TENSORIZED
QUAD_ORDER = 2
%
VOLUME_OUTPUT = (MINIMAL)
VOLUME_OUTPUT_FREQUENCY = 0
SCREEN_OUTPUT = (ITER, MASS, RMS_FLUX, VTK_OUTPUT, CSV_OUTPUT)
SCREEN_OUTPUT_FREQUENCY = 20
HISTORY_OUTPUT = (ITER, MASS, RMS_FLUX, VTK_OUTPUT, CSV_OUTPUT)
HISTORY_OUTPUT_FREQUENCY = 0
